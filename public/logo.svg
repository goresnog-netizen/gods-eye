<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 120 775 520" role="img" aria-labelledby="logo-title">
  <title id="logo-title">God's Eye</title>
  <desc>Bright red surveillance eye with a scanline iris, reticle ticks and glitch tears.</desc>
  <defs>
    <linearGradient id="iris_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#330606" />
      <stop offset="0.45" stop-color="#170202" />
      <stop offset="1" stop-color="#330606" />
    </linearGradient>
    <radialGradient id="pupil_fill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd0d0" />
      <stop offset="0.45" stop-color="#ff2b2b" />
      <stop offset="1" stop-color="#7d0000" />
    </radialGradient>
    <radialGradient id="hot_halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ff2b2b" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0" />
    </radialGradient>
    <pattern id="scanlines" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="2" y="0" fill="#ff5a5a" opacity="0.3" />
    </pattern>
    <clipPath id="iris_clip">
      <circle cx="567.5" cy="380" r="155" />
    </clipPath>
    <filter id="pupil_glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- HUD corner brackets: the machine is framing a target. -->
  <g fill="none" stroke="#ff2b2b" stroke-width="5" stroke-linecap="square" opacity="0.7">
    <path d="M212,198 L212,152 L258,152" />
    <path d="M877,152 L923,152 L923,198" />
    <path d="M212,562 L212,608 L258,608" />
    <path d="M877,608 L923,608 L923,562" />
  </g>

  <!-- Chromatic ghost of the lid: a one-pixel tear to the left. -->
  <path
    d="M248,380 C352,206 466,158 567.5,158 C669,158 783,206 887,380 C783,554 669,602 567.5,602 C466,602 352,554 248,380 Z"
    fill="none"
    stroke="#ff0033"
    stroke-width="9"
    opacity="0.35"
    transform="translate(-7 0)"
  />

  <g id="eye_shell">
    <path
      id="outer_eye"
      d="M248,380 C352,206 466,158 567.5,158 C669,158 783,206 887,380 C783,554 669,602 567.5,602 C466,602 352,554 248,380 Z"
      fill="#ff2b2b"
      fill-opacity="0.07"
      stroke="#ff2b2b"
      stroke-width="11"
      stroke-linejoin="round"
    />
    <!-- Hot rim: a thinner bright pass over the lid so it reads as lit, not painted. -->
    <path
      d="M266,380 C364,222 470,176 567.5,176 C665,176 771,222 869,380"
      fill="none"
      stroke="#ff8a8a"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.55"
    />
  </g>

  <!-- `#globe` is translated by src/logoGaze.js, so the iris follows the pointer. -->
  <g id="globe">
    <circle cx="567.5" cy="380" r="196" fill="url(#hot_halo)" />
    <circle cx="567.5" cy="380" r="155" fill="url(#iris_fill)" stroke="#ff3b3b" stroke-width="7" />
    <g clip-path="url(#iris_clip)">
      <rect x="412" y="225" width="311" height="310" fill="url(#scanlines)" />
      <path d="M412,300 L723,300" stroke="#ff5a5a" stroke-width="1.5" opacity="0.35" />
      <path d="M412,462 L723,462" stroke="#ff5a5a" stroke-width="1.5" opacity="0.35" />
    </g>
    <circle
      cx="567.5"
      cy="380"
      r="104"
      fill="none"
      stroke="#ff8a8a"
      stroke-width="3"
      stroke-dasharray="16 13"
      opacity="0.6"
    />
    <circle
      id="inner_eye"
      cx="567.5"
      cy="380"
      r="52"
      fill="url(#pupil_fill)"
      filter="url(#pupil_glow)"
    />
    <circle cx="567.5" cy="380" r="13" fill="#ffe8e8" />
  </g>

  <!-- `#globe_cage`: reticle ticks that drift with the iris. -->
  <g id="globe_cage" fill="none" stroke="#ff2b2b" stroke-width="6" stroke-linecap="round">
    <path d="M567.5,196 L567.5,166" />
    <path d="M567.5,594 L567.5,564" />
    <path d="M399,380 L369,380" />
    <path d="M766,380 L736,380" />
  </g>

  <!-- Signal corruption: two tears and a stray bit. -->
  <g fill="#ff6b6b">
    <rect x="286" y="316" width="64" height="5" opacity="0.8" />
    <rect x="806" y="450" width="58" height="5" opacity="0.7" />
    <rect x="248" y="378" width="32" height="4" opacity="0.85" />
    <rect x="742" y="234" width="7" height="7" opacity="0.6" />
    <rect x="404" y="528" width="6" height="6" opacity="0.55" />
  </g>
</svg>
